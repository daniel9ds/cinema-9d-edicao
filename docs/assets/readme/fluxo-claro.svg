<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1214" viewBox="0 0 720 1214" role="img" aria-labelledby="t d">
<title id="t">Fluxo de produção do Cinema 9D Edição</title>
<desc id="d">Sete etapas em sequência: 1 materiais e briefing (pessoa); 2 transcrição e proposta de cortes (automático, comando preparar); 3 direção e montagem (agente e automático); 4 prévia (automático, comando previa); 5 revisão humana (pessoa); 6 aprovação da revisão atual (pessoa, comando aprovar); 7 exportação final (automático, comando final). Uma seta tracejada leva os ajustes da revisão humana de volta à direção e montagem. Qualquer mudança invalida a aprovação anterior e exige nova prévia e nova aprovação.</desc>
